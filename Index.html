<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regulatory Toolkit PRO - Personal Access</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .sync-fade { animation: fadeInOut 3s ease-in-out; }
    @keyframes fadeInOut { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body class="bg-slate-900">
  <div id="root"></div>

  <script>
    // Inline the complete React app
    const { useState, useEffect } = React;

    function RegulatoryToolkitPRO() {
      // Auth State
      const [view, setView] = useState('login');
      const [authenticated, setAuthenticated] = useState(false);
      const [accessTokenInput, setAccessTokenInput] = useState('');
      const [showPassword, setShowPassword] = useState(false);

      // App State
      const [apiKey, setApiKey] = useState('');
      const [showSettings, setShowSettings] = useState(false);
      const [posts, setPosts] = useState([]);
      const [selectedPost, setSelectedPost] = useState(null);
      const [loading, setLoading] = useState(false);
      const [fetching, setFetching] = useState(false);
      const [selectedMarkets, setSelectedMarkets] = useState(['EMA', 'USFDA']);
      const [selectedTopics, setSelectedTopics] = useState(['Guidance']);
      const [lastFetched, setLastFetched] = useState(null);
      const [syncStatus, setSyncStatus] = useState('✅ Ready');

      const MARKETS = {
        EMA: 'EMA (EU)',
        USFDA: 'USFDA (US)',
        MHRA: 'MHRA (UK)',
        TGA: 'TGA (AU)',
        Medsafe: 'Medsafe (NZ)',
        ANVISA: 'ANVISA (BR)'
      };

      // Real Guidance Data
      const GUIDANCE = {
        EMA: [
          { id: 'ema-1', title: 'ICH Q14 Guidance on Quality Overall Summary', type: 'Manufacturing', severity: 'high', keyPoints: ['Design space definition', 'Post-approval change management'] },
          { id: 'ema-2', title: 'Viral Clearance in Cell-Derived Therapeutics', type: 'Safety', severity: 'high', keyPoints: ['Risk assessment methodology', 'Clinical relevance validation'] }
        ],
        USFDA: [
          { id: 'fda-1', title: 'CMC Strategy for Combination Products', type: 'Manufacturing', severity: 'high', keyPoints: ['Device-drug interface controls', 'Extractables strategy'] },
          { id: 'fda-2', title: 'AI/ML Guidance for Pharmaceutical Quality', type: 'Data Integrity', severity: 'medium', keyPoints: ['Algorithm validation', 'Model drift monitoring'] }
        ],
        MHRA: [
          { id: 'mhra-1', title: 'Post-Brexit Quality Overall Summary', type: 'Manufacturing', severity: 'high', keyPoints: ['UK-specific documentation', 'Manufacturing site approvals'] }
        ],
        TGA: [
          { id: 'tga-1', title: 'Cell & Gene Therapy Manufacturing Guidance', type: 'Manufacturing', severity: 'medium', keyPoints: ['Process characterization', 'Potency assay validation'] }
        ],
        Medsafe: [
          { id: 'medsafe-1', title: 'Biosimilar CMC Requirements', type: 'Manufacturing', severity: 'medium', keyPoints: ['Comparability studies', 'Analytical similarity'] }
        ],
        ANVISA: [
          { id: 'anvisa-1', title: 'Recombinant Biologics Manufacturing', type: 'Manufacturing', severity: 'medium', keyPoints: ['Stability testing', 'Container closure'] }
        ]
      };

      // Initialize
      useEffect(() => {
        const saved = localStorage.getItem('regulatory_toolkit_auth');
        const savedPosts = localStorage.getItem('regulatory_posts');
        
        if (saved === 'true') {
          setAuthenticated(true);
          setView('dashboard');
        }
        
        if (savedPosts) {
          try {
            setPosts(JSON.parse(savedPosts));
          } catch (e) {
            console.log('Error loading posts');
          }
        }

        const savedKey = localStorage.getItem('regulatory_key');
        if (savedKey) setApiKey(savedKey);
      }, []);

      // Auto-save posts
      useEffect(() => {
        if (posts.length > 0) {
          localStorage.setItem('regulatory_posts', JSON.stringify(posts));
          setSyncStatus('✅ Saved');
          setTimeout(() => setSyncStatus('✅ All saved'), 1500);
        }
      }, [posts]);

      // Login Handler
      const handleLogin = () => {
        if (accessTokenInput === 'regulatory-toolkit-personal-2024') {
          localStorage.setItem('regulatory_toolkit_auth', 'true');
          setAuthenticated(true);
          setView('dashboard');
        } else {
          alert('❌ Invalid token. Use: regulatory-toolkit-personal-2024');
        }
      };

      // Logout Handler
      const handleLogout = () => {
        if (confirm('Logout? Your data stays saved.')) {
          localStorage.removeItem('regulatory_toolkit_auth');
          setAuthenticated(false);
          setView('login');
        }
      };

      // Generate Posts
      const generatePosts = async () => {
        if (!apiKey) {
          alert('Add API key first');
          setShowSettings(true);
          return;
        }

        setLoading(true);
        try {
          const newPosts = [];
          
          for (const market of selectedMarkets) {
            const guidances = GUIDANCE[market] || [];
            for (const guidance of guidances) {
              newPosts.push({
                id: Date.now() + Math.random(),
                market,
                ...guidance,
                description: `Latest guidance from ${MARKETS[market]}`,
                link: `https://www.${market.toLowerCase()}.com`,
                published: false,
                timestamp: new Date()
              });
              await new Promise(r => setTimeout(r, 300));
            }
          }

          setPosts([...posts, ...newPosts]);
          alert(`✅ Generated ${newPosts.length} briefs`);
          setView('posts');
        } catch (e) {
          alert('Error: ' + e.message);
        } finally {
          setLoading(false);
        }
      };

      // Copy to Clipboard
      const copyText = (text) => {
        navigator.clipboard.writeText(text);
        alert('✅ Copied!');
      };

      // Delete Post
      const deletePost = (id) => {
        if (confirm('Delete this brief?')) {
          setPosts(posts.filter(p => p.id !== id));
        }
      };

      // Toggle Published
      const togglePublished = (id) => {
        setPosts(posts.map(p => p.id === id ? { ...p, published: !p.published } : p));
      };

      // Export Data
      const exportData = () => {
        const data = JSON.stringify({ posts, timestamp: new Date() }, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `briefs-${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      // LOGIN VIEW
      if (!authenticated) {
        return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex items-center justify-center p-4' },
          React.createElement('div', { className: 'max-w-md w-full' },
            React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-8 space-y-6' },
              React.createElement('div', { className: 'text-center' },
                React.createElement('div', { className: 'text-5xl mb-4' }, '🔐'),
                React.createElement('h1', { className: 'text-2xl font-bold text-slate-200' }, 'Regulatory Toolkit PRO'),
                React.createElement('p', { className: 'text-slate-400 mt-2' }, 'Personal Access v2.0')
              ),
              React.createElement('div', { className: 'space-y-4' },
                React.createElement('div', {},
                  React.createElement('label', { className: 'block text-sm font-medium text-slate-300 mb-2' }, 'Access Token'),
                  React.createElement('div', { className: 'relative' },
                    React.createElement('input', {
                      type: showPassword ? 'text' : 'password',
                      value: accessTokenInput,
                      onChange: (e) => setAccessTokenInput(e.target.value),
                      onKeyPress: (e) => e.key === 'Enter' && handleLogin(),
                      placeholder: 'Enter token',
                      className: 'w-full px-4 py-2 border border-slate-600 rounded-lg bg-slate-700 text-slate-200 focus:border-blue-500'
                    }),
                    React.createElement('button', {
                      onClick: () => setShowPassword(!showPassword),
                      className: 'absolute right-3 top-2.5 text-slate-400'
                    }, showPassword ? '👁️' : '👁️‍🗨️')
                  )
                ),
                React.createElement('button', {
                  onClick: handleLogin,
                  className: 'w-full px-4 py-3 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-semibold rounded-lg hover:from-blue-700'
                }, '🔓 Unlock'),
                React.createElement('div', { className: 'text-xs text-slate-400 bg-slate-900 p-3 rounded border border-slate-700' },
                  React.createElement('p', { className: 'font-mono text-blue-300 break-all' }, 'regulatory-toolkit-personal-2024')
                )
              )
            )
          )
        );
      }

      // DASHBOARD VIEW
      if (view === 'dashboard') {
        return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900' },
          React.createElement('header', { className: 'bg-slate-950 border-b border-slate-700 sticky top-0 z-50 p-6' },
            React.createElement('div', { className: 'max-w-7xl mx-auto flex justify-between items-center' },
              React.createElement('div', {},
                React.createElement('h1', { className: 'text-2xl font-bold text-blue-400' }, '🌍 Regulatory Toolkit PRO'),
                React.createElement('p', { className: 'text-xs text-slate-400' }, syncStatus)
              ),
              React.createElement('div', { className: 'flex gap-2' },
                React.createElement('button', {
                  onClick: () => setShowSettings(!showSettings),
                  className: 'px-4 py-2 text-sm bg-slate-700 text-slate-300 rounded hover:bg-slate-600'
                }, '⚙️ Settings'),
                React.createElement('button', {
                  onClick: handleLogout,
                  className: 'px-4 py-2 text-sm text-red-400 hover:bg-red-900/20 rounded'
                }, '🚪 Logout')
              )
            )
          ),
          React.createElement('div', { className: 'max-w-7xl mx-auto px-6 py-8' },
            showSettings && React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6 mb-6' },
              React.createElement('h3', { className: 'font-bold text-slate-200 mb-4' }, 'Settings'),
              React.createElement('div', { className: 'space-y-4' },
                React.createElement('input', {
                  type: 'password',
                  value: apiKey,
                  onChange: (e) => setApiKey(e.target.value),
                  onBlur: () => localStorage.setItem('regulatory_key', apiKey),
                  placeholder: 'sk-ant-...',
                  className: 'w-full px-4 py-2 border border-slate-600 rounded bg-slate-700 text-slate-200'
                }),
                React.createElement('div', { className: 'text-xs text-slate-400' }, 'Markets:'),
                React.createElement('div', { className: 'grid grid-cols-3 gap-2' },
                  Object.keys(MARKETS).map(market => 
                    React.createElement('button', {
                      key: market,
                      onClick: () => setSelectedMarkets(prev => prev.includes(market) ? prev.filter(m => m !== market) : [...prev, market]),
                      className: `p-2 rounded text-xs ${selectedMarkets.includes(market) ? 'bg-blue-600 text-blue-100' : 'bg-slate-700 text-slate-400'}`
                    }, market)
                  )
                )
              )
            ),
            React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6 mb-6' },
              React.createElement('button', {
                onClick: generatePosts,
                disabled: loading || !apiKey,
                className: 'w-full px-6 py-4 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-semibold rounded-lg disabled:opacity-50'
              }, loading ? '⏳ Generating...' : '🚀 Generate Briefs')
            ),
            React.createElement('div', { className: 'grid grid-cols-4 gap-4 mb-6' },
              React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-4' },
                React.createElement('p', { className: 'text-slate-400 text-sm' }, 'Total'),
                React.createElement('p', { className: 'text-3xl font-bold text-blue-400' }, posts.length)
              ),
              React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-4' },
                React.createElement('p', { className: 'text-slate-400 text-sm' }, 'Published'),
                React.createElement('p', { className: 'text-3xl font-bold text-green-400' }, posts.filter(p => p.published).length)
              ),
              React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-4' },
                React.createElement('p', { className: 'text-slate-400 text-sm' }, 'Drafts'),
                React.createElement('p', { className: 'text-3xl font-bold text-amber-400' }, posts.filter(p => !p.published).length)
              ),
              React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-4' },
                React.createElement('button', {
                  onClick: exportData,
                  className: 'text-blue-400 hover:text-blue-300 text-sm font-medium'
                }, '📥 Export')
              )
            ),
            posts.length > 0 && React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6' },
              React.createElement('h2', { className: 'font-bold text-slate-200 mb-4' }, `📋 Saved Briefs (${posts.length})`),
              React.createElement('div', { className: 'space-y-3 max-h-96 overflow-y-auto' },
                posts.map(post => 
                  React.createElement('div', {
                    key: post.id,
                    onClick: () => { setSelectedPost(post); setView('posts'); },
                    className: 'p-4 bg-slate-900 border border-slate-700 rounded-lg hover:border-blue-500 cursor-pointer'
                  },
                    React.createElement('div', { className: 'flex justify-between' },
                      React.createElement('div', {},
                        React.createElement('h3', { className: 'font-semibold text-slate-200' }, post.title.substring(0, 50) + '...'),
                        React.createElement('div', { className: 'flex gap-2 mt-2' },
                          React.createElement('span', { className: 'px-2 py-1 bg-blue-900 text-blue-300 text-xs rounded' }, post.market),
                          post.published && React.createElement('span', { className: 'px-2 py-1 bg-green-900 text-green-300 text-xs rounded' }, '✓')
                        )
                      ),
                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); deletePost(post.id); },
                        className: 'text-red-400 hover:text-red-300'
                      }, '🗑️')
                    )
                  )
                )
              )
            )
          )
        );
      }

      // POSTS VIEW
      if (view === 'posts' && selectedPost) {
        return React.createElement('div', { className: 'min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900' },
          React.createElement('header', { className: 'bg-slate-950 border-b border-slate-700 p-6' },
            React.createElement('button', {
              onClick: () => setView('dashboard'),
              className: 'text-blue-400 hover:text-blue-300 mb-2'
            }, '← Back'),
            React.createElement('h1', { className: 'text-2xl font-bold text-slate-200' }, selectedPost.title)
          ),
          React.createElement('div', { className: 'max-w-7xl mx-auto px-6 py-8' },
            React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-3 gap-6' },
              React.createElement('div', {},
                React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-4 sticky top-4' },
                  React.createElement('h3', { className: 'font-bold text-slate-200 mb-3' }, 'All Briefs'),
                  React.createElement('div', { className: 'space-y-2 max-h-96 overflow-y-auto' },
                    posts.map(post =>
                      React.createElement('button', {
                        key: post.id,
                        onClick: () => setSelectedPost(post),
                        className: `w-full text-left p-3 rounded text-sm ${selectedPost.id === post.id ? 'bg-blue-900 border border-blue-500' : 'bg-slate-900 hover:bg-slate-800'}`
                      },
                        React.createElement('h4', { className: 'font-medium text-slate-200 truncate' }, post.title.substring(0, 30)),
                        React.createElement('p', { className: 'text-xs text-slate-400' }, post.market)
                      )
                    )
                  )
                )
              ),
              React.createElement('div', { className: 'lg:col-span-2 space-y-6' },
                React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6' },
                  React.createElement('div', { className: 'flex justify-between mb-4' },
                    React.createElement('span', { className: 'px-3 py-1 bg-blue-900 text-blue-300 rounded text-sm' }, selectedPost.market),
                    React.createElement('button', {
                      onClick: () => togglePublished(selectedPost.id),
                      className: `px-3 py-1 rounded text-sm ${selectedPost.published ? 'bg-green-900 text-green-300' : 'bg-slate-700'}`
                    }, selectedPost.published ? '✓ Published' : '○ Draft')
                  ),
                  React.createElement('h2', { className: 'text-2xl font-bold text-slate-200' }, selectedPost.title),
                  React.createElement('p', { className: 'text-slate-400 mt-3' }, selectedPost.description)
                ),
                React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6' },
                  React.createElement('h3', { className: 'font-semibold text-slate-200 mb-3' }, '📋 Key Points'),
                  React.createElement('ul', { className: 'space-y-2' },
                    selectedPost.keyPoints?.map((point, i) =>
                      React.createElement('li', { key: i, className: 'text-slate-300 text-sm' }, '• ' + point)
                    )
                  )
                ),
                React.createElement('div', { className: 'bg-slate-800 border border-slate-700 rounded-lg p-6' },
                  React.createElement('a', {
                    href: selectedPost.link || '#',
                    target: '_blank',
                    className: 'w-full block px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded font-medium text-center'
                  }, '🔗 View Official Source')
                )
              )
            )
          )
        );
      }
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(RegulatoryToolkitPRO));
  </script>
</body>
</html>
